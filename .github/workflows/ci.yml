name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  workspace:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
          - name: Linux
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-workspace
          cache-on-failure: true
      - name: Linux GPUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libfontconfig1-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libzstd-dev libvulkan1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.32.1
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Product baseline and UI contract
        run: |
          python scripts/check-docs.py
          pnpm run lint
          pnpm run test:ui-lint
          node scripts/sync-gpui-reference.mjs --check
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - name: Build command-line tools and check team collaboration
        run: |
          cargo build --locked -p shipforge-cli -p shipforge-worker -p shipforge-server
          python scripts/sync-protocol.py --check
          python scripts/verify-team.py target/debug
      - name: Build Windows release
        if: runner.os == 'Windows'
        run: cargo build --release --workspace --locked
      - name: Verify Windows ZIP and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package.ps1 -SkipBuild
          python scripts/verify-package.py dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify-installer.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          name: windows-package
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*-setup.exe
          if-no-files-found: error
