[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.15.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/Hubujiu/ShipForge"

[workspace.dependencies]
anyhow = "1"
blake3 = "1.8"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6.0"
dunce = "1.0"
gpui-kit = "=0.9.1"
rusqlite = { version = "0.43", features = ["bundled", "backup"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3"
tiny_http = "0.12"
ureq = { version = "3.5", default-features = false, features = ["rustls", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
shipforge-client = { path = "crates/shipforge-client" }
shipforge-core = { path = "crates/shipforge-core" }

[profile.release]
strip = "debuginfo"
