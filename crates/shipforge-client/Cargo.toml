[package]
name = "shipforge-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes = "0.8"
md-5 = "0.10"
qrcodegen = "1.8"
prost = "0.14"
flate2 = "1"
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
zip = { version = "9.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
base64 = "0.22"
chrono.workspace = true
directories.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ring = "0.17"
shipforge-core.workspace = true
tempfile.workspace = true
ureq.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
