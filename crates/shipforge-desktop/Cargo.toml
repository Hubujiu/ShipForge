[package]
name = "shipforge-desktop"
version.workspace = true
edition.workspace = true
rust-version = "1.92"
publish = false
description = "ShipForge native team workbench"
[dependencies]
chrono.workspace = true
gpui-kit = "=0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shipforge-client = { path = "../shipforge-client" }
shipforge-core = { path = "../shipforge-core" }
uuid.workspace = true
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation","Win32_UI_Shell","Win32_UI_WindowsAndMessaging"] }
windows = { version = "=0.61.3", features = ["Data_Xml_Dom", "UI_Notifications"] }
[target.'cfg(windows)'.dev-dependencies]
tiny_http.workspace = true
ureq.workspace = true
url.workspace = true
tempfile.workspace = true
[build-dependencies]
embed-resource = "=3.0.12"
resvg = { version = "=0.45.1", default-features = false }
